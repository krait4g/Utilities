name: tmp-youtube-source-analysis

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  embed-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser tools
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install playwright requests pillow
          python -m playwright install --with-deps chromium
      - name: Capture from YouTube embed/nocookie player
        run: |
          mkdir -p out/frames out/text out/media out/contact
          xvfb-run -a python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          import json,time,re,traceback,urllib.parse,math,requests,subprocess
          vid='woSiT_kytXo'; out=Path('out'); fd=out/'frames'; td=out/'text'; md=out/'media'; cd=out/'contact'
          urls=[]; logs=[]
          def log(s): logs.append(str(s)); print(s,flush=True)
          embeds=[f'https://www.youtube-nocookie.com/embed/{vid}?autoplay=1&mute=1&controls=1&playsinline=1',f'https://www.youtube.com/embed/{vid}?autoplay=1&mute=1&controls=1&playsinline=1']
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=False,args=['--autoplay-policy=no-user-gesture-required','--no-sandbox','--disable-blink-features=AutomationControlled'])
            ctx=browser.new_context(viewport={'width':1280,'height':720},locale='ko-KR',user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36')
            page=ctx.new_page()
            page.on('request',lambda req: urls.append(req.url) if 'googlevideo.com/videoplayback' in req.url else None)
            success=False
            for eu in embeds:
              try:
                r=page.goto(eu,wait_until='domcontentloaded',timeout=90000); log(f'goto {eu} status={r.status if r else None} title={page.title()}')
                page.wait_for_timeout(6000)
                (td/f'embed_{len(logs)}.html').write_text(page.content(),encoding='utf-8')
                page.screenshot(path=str(td/f'embed_{len(logs)}.jpg'),quality=75,type='jpeg')
                n=page.locator('video').count(); log(f'video_count={n}')
                if n<1: continue
                info=page.evaluate("() => {const v=document.querySelector('video'); return {duration:v.duration,readyState:v.readyState,w:v.videoWidth,h:v.videoHeight,paused:v.paused,error:v.error?{code:v.error.code,message:v.error.message}:null,display:getComputedStyle(v).display,visibility:getComputedStyle(v).visibility};}")
                log('before='+json.dumps(info,ensure_ascii=False))
                page.evaluate("() => {const v=document.querySelector('video'); v.muted=true; v.volume=0; v.play().catch(()=>{});}")
                page.wait_for_timeout(10000)
                info=page.evaluate("() => {const v=document.querySelector('video'); return {duration:v.duration,currentTime:v.currentTime,readyState:v.readyState,w:v.videoWidth,h:v.videoHeight,paused:v.paused,error:v.error?{code:v.error.code,message:v.error.message}:null};}")
                log('after='+json.dumps(info,ensure_ascii=False))
                duration=info.get('duration') or 0
                if not duration or duration>10000: continue
                vloc=page.locator('video')
                targets=[x*2.0 for x in range(int(duration//2)+1)]
                cap=[]; fails=[]
                for i,t in enumerate(targets):
                  try:
                    page.evaluate("t => {const v=document.querySelector('video'); v.pause(); v.currentTime=t;}",t)
                    page.wait_for_function("t => {const v=document.querySelector('video'); return v && v.readyState>=2 && Math.abs(v.currentTime-t)<1.25;}",t,timeout=5000)
                    fn=f'f_{i:05d}_{int(t*1000):010d}.jpg'; vloc.screenshot(path=str(fd/fn),type='jpeg',quality=74); cap.append({'t':t,'file':fn})
                    if i%100==0: log(f'capture {i}/{len(targets)} t={t}')
                  except Exception as e:
                    fails.append({'t':t,'e':type(e).__name__+':'+str(e)[:150]})
                (td/'frame_manifest.json').write_text(json.dumps({'source':eu,'duration':duration,'interval':2,'captured':cap,'failures':fails},ensure_ascii=False,indent=2),encoding='utf-8')
                log(f'CAPTURED={len(cap)} TARGET={len(targets)} FAIL={len(fails)}')
                success=len(cap)>100
                if success: break
              except Exception:
                log(traceback.format_exc())
            # extra resource URLs
            try: urls += page.evaluate("() => performance.getEntriesByType('resource').map(x=>x.name).filter(x=>x.includes('googlevideo.com/videoplayback'))") or []
            except: pass
            uniq=[]; seen=set()
            for u in urls:
              if u not in seen:seen.add(u);uniq.append(u)
            (td/'googlevideo_urls.json').write_text(json.dumps(uniq,ensure_ascii=False,indent=2),encoding='utf-8'); log(f'googlevideo_urls={len(uniq)} success={success}')
            browser.close()
          (td/'status.txt').write_text('\n'.join(logs),encoding='utf-8')
          # Build per-minute contact sheets from 2-second captures.
          imgs=sorted(fd.glob('f_*.jpg'))
          try: font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',15)
          except: font=ImageFont.load_default()
          ci=[]
          for gi in range(math.ceil(len(imgs)/30)):
            ss=imgs[gi*30:(gi+1)*30]
            if not ss: continue
            tw,th,lh,cols=256,144,20,5; rows=math.ceil(len(ss)/cols); can=Image.new('RGB',(tw*cols,(th+lh)*rows),'white')
            for n,pth in enumerate(ss):
              im=Image.open(pth).convert('RGB'); im.thumbnail((tw,th)); tile=Image.new('RGB',(tw,th),'black'); tile.paste(im,((tw-im.width)//2,(th-im.height)//2)); x=(n%cols)*tw; y=(n//cols)*(th+lh); can.paste(tile,(x,y)); mt=re.search(r'_(\d{10})\.jpg$',pth.name); sec=(int(mt.group(1))/1000 if mt else 0); mm=int(sec//60); s=sec-mm*60; ImageDraw.Draw(can).text((x+2,y+th+1),f'{mm:02d}:{s:04.1f}',fill='black',font=font)
            op=cd/f'min_{gi:02d}.jpg'; can.save(op,quality=72,optimize=True); ci.append(op.name)
          (td/'contact_index.json').write_text(json.dumps(ci,indent=2),encoding='utf-8')
          # Try direct media requests obtained from the embedded player.
          def meta(u):
            q=urllib.parse.parse_qs(urllib.parse.urlparse(u).query); return urllib.parse.unquote(q.get('mime',[''])[0]),q.get('itag',[''])[0]
          aud=[]; vds=[]
          for u in json.loads((td/'googlevideo_urls.json').read_text()):
            mime,itag=meta(u)
            if 'audio/' in mime: aud.append((u,mime,itag))
            if 'video/' in mime: vds.append((u,mime,itag))
          ms=[f'video={len(vds)} audio={len(aud)}']
          def dl(x,path):
            u,mime,itag=x
            with requests.get(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.youtube.com/'},stream=True,timeout=(20,240)) as r:
              ms.append(f'GET {itag} {mime} status={r.status_code} len={r.headers.get("content-length")} range={r.headers.get("content-range")}')
              r.raise_for_status()
              with open(path,'wb') as f:
                for ch in r.iter_content(1024*1024):
                  if ch:f.write(ch)
          try:
            if vds: dl(vds[0],md/'v.bin')
            if aud: dl(aud[0],md/'a.bin')
            if (md/'v.bin').exists() and (md/'a.bin').exists(): subprocess.run(['ffmpeg','-y','-i',str(md/'v.bin'),'-i',str(md/'a.bin'),'-c','copy',str(md/'source.mp4')],timeout=600,capture_output=True); ms.append(f'source={ (md/"source.mp4").exists() }')
          except Exception: ms.append(traceback.format_exc())
          (td/'media_status.txt').write_text('\n'.join(ms),encoding='utf-8')
          PY
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: wosit-embed-visual
          path: |
            out/text
            out/contact
            out/frames
          compression-level: 6
          if-no-files-found: warn
      - name: Upload media if captured
        uses: actions/upload-artifact@v4
        with:
          name: wosit-embed-media
          path: out/media
          compression-level: 1
          if-no-files-found: warn
