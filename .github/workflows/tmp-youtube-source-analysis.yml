name: tmp-youtube-source-analysis

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  cobalt-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Start yt session generator and cobalt
        run: |
          set +e
          mkdir -p out/text out/media
          docker pull ghcr.io/imputnet/yt-session-generator:webserver > out/text/pull_session.log 2>&1
          docker pull ghcr.io/imputnet/cobalt:11 > out/text/pull_cobalt.log 2>&1
          docker run -d --name yt-session --privileged -p 8080:8080 ghcr.io/imputnet/yt-session-generator:webserver > out/text/session_container_id.txt 2>&1
          # Wait for token endpoint. The generator can need Chromium startup time.
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/token > out/text/session_token.json 2>/dev/null; then ok=1; echo "session_ready_at=$i" > out/text/session_status.txt; break; fi
            sleep 2
          done
          echo "session_ready=$ok" >> out/text/session_status.txt
          docker logs yt-session > out/text/session_generator.log 2>&1 || true

          docker run -d --name cobalt --add-host host.docker.internal:host-gateway -p 9000:9000 \
            -e API_URL=http://127.0.0.1:9000/ \
            -e YOUTUBE_SESSION_SERVER=http://host.docker.internal:8080/token \
            -e YOUTUBE_SESSION_INNERTUBE_CLIENT=WEB \
            -e ENABLE_DEPRECATED_YOUTUBE_HLS=always \
            ghcr.io/imputnet/cobalt:11 > out/text/cobalt_container_id.txt 2>&1
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:9000/ > out/text/cobalt_root.txt 2>/dev/null; then echo "cobalt_ready_at=$i" > out/text/cobalt_status.txt; break; fi
            sleep 2
          done
          docker logs cobalt > out/text/cobalt_start.log 2>&1 || true

      - name: Ask cobalt for target video
        env:
          VIDEO_URL: https://www.youtube.com/watch?v=woSiT_kytXo
        run: |
          set +e
          mkdir -p out/text out/media
          # Try modern request variants, first ordinary auto mode then HLS-assisted.
          python - <<'PY'
          import requests,json,os,time,traceback
          from pathlib import Path
          out=Path('out'); td=out/'text'; md=out/'media'; url=os.environ['VIDEO_URL']
          attempts=[
            {'url':url,'videoQuality':'480','downloadMode':'auto','filenameStyle':'basic'},
            {'url':url,'videoQuality':'720','downloadMode':'auto','filenameStyle':'basic'},
            {'url':url,'videoQuality':'480','downloadMode':'auto','filenameStyle':'basic','youtubeHLS':True},
            {'url':url,'downloadMode':'audio','audioFormat':'best','filenameStyle':'basic'},
          ]
          log=[]
          sess=requests.Session(); sess.headers.update({'Accept':'application/json','Content-Type':'application/json','User-Agent':'Mozilla/5.0'})
          for i,payload in enumerate(attempts):
            try:
              r=sess.post('http://127.0.0.1:9000/',json=payload,timeout=90)
              log.append(f'ATTEMPT {i} HTTP {r.status_code} {r.text[:2000]}')
              (td/f'cobalt_response_{i}.txt').write_text(r.text,encoding='utf-8')
              if r.status_code!=200: continue
              try:data=r.json()
              except:continue
              u=data.get('url')
              if not u: continue
              # Tunnel URL may use API_URL host; normalize localhost if necessary.
              u=u.replace('http://127.0.0.1:9000','http://127.0.0.1:9000').replace('http://localhost:9000','http://127.0.0.1:9000')
              dest=md/(f'cobalt_{i}.bin')
              with sess.get(u,stream=True,allow_redirects=True,timeout=(20,600)) as rr:
                log.append(f'DOWNLOAD {i} HTTP {rr.status_code} content-type={rr.headers.get("content-type")} len={rr.headers.get("content-length")} final={rr.url}')
                rr.raise_for_status()
                with open(dest,'wb') as f:
                  for ch in rr.iter_content(1024*1024):
                    if ch:f.write(ch)
              log.append(f'DOWNLOADED {dest} bytes={dest.stat().st_size}')
            except Exception:
              log.append(f'ATTEMPT {i} ERROR\n{traceback.format_exc()}')
          (td/'cobalt_attempts.log').write_text('\n\n'.join(log),encoding='utf-8')
          PY
          docker logs cobalt > out/text/cobalt_final.log 2>&1 || true
          docker logs yt-session > out/text/session_final.log 2>&1 || true
          ls -lh out/media > out/text/media_ls.txt || true
          exit 0

      - name: Identify playable outputs and derive video/audio
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          import subprocess,json,os
          md=Path('out/media'); td=Path('out/text'); rows=[]
          candidates=sorted(md.glob('cobalt_*.bin'),key=lambda p:p.stat().st_size,reverse=True)
          selected=None
          for p in candidates:
            pr=subprocess.run(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(p)],capture_output=True,text=True)
            rows.append({'file':p.name,'bytes':p.stat().st_size,'ffprobe_rc':pr.returncode,'ffprobe':pr.stdout[:20000],'stderr':pr.stderr[:2000]})
            if pr.returncode==0 and selected is None:selected=p
          (td/'probe_results.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          if selected:
            # Remux by stream copy if possible; otherwise transcode just enough for analysis.
            r=subprocess.run(['ffmpeg','-y','-i',str(selected),'-c','copy',str(md/'source.mp4')],capture_output=True,text=True)
            if r.returncode!=0:
              subprocess.run(['ffmpeg','-y','-i',str(selected),'-c:v','libx264','-preset','veryfast','-crf','26','-c:a','aac','-b:a','96k',str(md/'source.mp4')],capture_output=True,text=True)
            src=md/'source.mp4'
            if src.exists():
              subprocess.run(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(src)],stdout=open(td/'source_ffprobe.json','w'),stderr=subprocess.DEVNULL)
              subprocess.run(['ffmpeg','-y','-i',str(src),'-vn','-ac','1','-ar','16000','-c:a','pcm_s16le',str(md/'audio_16k.wav')],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          PY
          exit 0

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: wosit-cobalt-evidence
          path: |
            out/text
            out/media
          compression-level: 1
          if-no-files-found: warn
