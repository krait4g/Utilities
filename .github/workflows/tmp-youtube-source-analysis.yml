name: tmp-youtube-source-analysis

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  browser-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser tools
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb
          python -m pip install --upgrade pip
          python -m pip install playwright requests
          python -m playwright install --with-deps chromium
      - name: Render YouTube and capture frames + media URLs
        env:
          VIDEO_ID: woSiT_kytXo
          VIDEO_URL: https://www.youtube.com/watch?v=woSiT_kytXo
        run: |
          mkdir -p out/browser_frames out/text out/media
          xvfb-run -a python - <<'PY'
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError
          from pathlib import Path
          import json, time, re, traceback, urllib.parse, os
          VIDEO_URL=os.environ['VIDEO_URL']
          out=Path('out'); fd=out/'browser_frames'; td=out/'text'; md=out/'media'
          status=[]; media_urls=[]
          def log(x): status.append(str(x)); print(x, flush=True)
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=False, args=['--autoplay-policy=no-user-gesture-required','--disable-blink-features=AutomationControlled','--no-sandbox'])
            ctx=browser.new_context(viewport={'width':1280,'height':720}, locale='ko-KR', user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36')
            page=ctx.new_page()
            def on_request(req):
              u=req.url
              if 'googlevideo.com/videoplayback' in u:
                media_urls.append(u)
            page.on('request', on_request)
            try:
              resp=page.goto(VIDEO_URL, wait_until='domcontentloaded', timeout=90000)
              log(f'goto_status={resp.status if resp else None} url={page.url} title={page.title()}')
              page.screenshot(path=str(td/'page_initial.jpg'), full_page=False, quality=75, type='jpeg')
              # dismiss likely consent dialogs
              for label in ['Accept all','Reject all','모두 수락','모두 거부','동의','확인']:
                try:
                  loc=page.get_by_role('button', name=re.compile(label, re.I))
                  if loc.count()>0:
                    loc.first.click(timeout=1500); log(f'clicked={label}'); page.wait_for_timeout(1000); break
                except Exception: pass
              page.wait_for_timeout(5000)
              # save html snippets for diagnostics
              (td/'page.html').write_text(page.content(),encoding='utf-8')
              # inspect player data
              player=page.evaluate("() => ({hasVideo:!!document.querySelector('video'), title:document.title, yt: window.ytInitialPlayerResponse || null})")
              if player.get('yt'):
                (td/'ytInitialPlayerResponse.json').write_text(json.dumps(player['yt'],ensure_ascii=False,indent=2),encoding='utf-8')
              log(f'has_video={player.get("hasVideo")}')
              page.wait_for_selector('video', timeout=60000)
              # mute and start to force media requests
              page.evaluate("() => {const v=document.querySelector('video'); v.muted=true; v.volume=0; v.playbackRate=1; v.play().catch(()=>{});}")
              page.wait_for_timeout(8000)
              info=page.evaluate("() => {const v=document.querySelector('video'); return {duration:v.duration,currentTime:v.currentTime,readyState:v.readyState,videoWidth:v.videoWidth,videoHeight:v.videoHeight,paused:v.paused,error:v.error?{code:v.error.code,message:v.error.message}:null};}")
              log('video_info='+json.dumps(info,ensure_ascii=False))
              duration=info.get('duration') or 0
              if duration and duration < 10000:
                # capture a visual representative every 2 s across the entire source.
                # This renders actual player frames; retries tolerate sparse buffering failures.
                targets=[round(x*2.0,3) for x in range(int(duration//2)+1)]
                captured=[]; failures=[]
                video=page.locator('video')
                for i,t in enumerate(targets):
                  try:
                    page.evaluate("t => {const v=document.querySelector('video'); v.pause(); v.currentTime=t;}", t)
                    # wait until seek position is close or at least frame ready
                    page.wait_for_function("t => {const v=document.querySelector('video'); return v && v.readyState>=2 && Math.abs(v.currentTime-t)<1.5;}", t, timeout=8000)
                    fn=f'frame_{i:05d}_{int(t*1000):010d}.jpg'
                    video.screenshot(path=str(fd/fn), type='jpeg', quality=72)
                    captured.append({'t':t,'file':fn})
                    if i%50==0: log(f'captured {i}/{len(targets)} t={t}')
                  except Exception as e:
                    failures.append({'t':t,'error':type(e).__name__+': '+str(e)[:200]})
                    if len(failures)<20: log(f'capture_fail t={t}: {e}')
                (td/'browser_frame_manifest.json').write_text(json.dumps({'duration':duration,'interval_sec':2,'captured':captured,'failures':failures},ensure_ascii=False,indent=2),encoding='utf-8')
                log(f'capture_summary target={len(targets)} captured={len(captured)} failures={len(failures)}')
              # collect resource timing URLs too
              perf=page.evaluate("() => performance.getEntriesByType('resource').map(x=>x.name).filter(x=>x.includes('googlevideo.com/videoplayback'))")
              media_urls.extend(perf or [])
              cookies=ctx.cookies()
              (td/'browser_cookies.json').write_text(json.dumps(cookies,ensure_ascii=False,indent=2),encoding='utf-8')
            except Exception:
              log('FATAL_BROWSER='+traceback.format_exc())
            finally:
              uniq=[]; seen=set()
              for u in media_urls:
                if u not in seen: seen.add(u); uniq.append(u)
              (td/'googlevideo_urls.json').write_text(json.dumps(uniq,ensure_ascii=False,indent=2),encoding='utf-8')
              log(f'googlevideo_url_count={len(uniq)}')
              browser.close()
          (td/'browser_status.txt').write_text('\n'.join(status),encoding='utf-8')
          PY
      - name: Try downloading captured googlevideo streams
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          import json,requests,urllib.parse,subprocess,os,traceback
          td=Path('out/text'); md=Path('out/media'); st=[]
          p=td/'googlevideo_urls.json'
          urls=json.loads(p.read_text()) if p.exists() else []
          def classify(u):
            q=urllib.parse.parse_qs(urllib.parse.urlparse(u).query)
            mime=urllib.parse.unquote((q.get('mime',[''])[0] or ''))
            itag=(q.get('itag',[''])[0] or '')
            return mime,itag
          aud=[]; vid=[]
          for u in urls:
            mime,itag=classify(u)
            if 'audio/' in mime: aud.append((u,mime,itag))
            elif 'video/' in mime: vid.append((u,mime,itag))
          st.append(f'urls={len(urls)} video_urls={len(vid)} audio_urls={len(aud)}')
          headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.youtube.com/'}
          def dl(item,path):
            u,mime,itag=item
            # captured requests may include Range query constraints; ask server for the full stream with HTTP ranges
            with requests.get(u,headers=headers,stream=True,timeout=(20,180)) as r:
              st.append(f'GET itag={itag} mime={mime} status={r.status_code} len={r.headers.get("content-length")} range={r.headers.get("content-range")}')
              r.raise_for_status()
              with open(path,'wb') as f:
                for ch in r.iter_content(1024*1024):
                  if ch:f.write(ch)
            st.append(f'downloaded {path} bytes={Path(path).stat().st_size}')
          try:
            if vid: dl(vid[0],md/'captured_video.bin')
            if aud: dl(aud[0],md/'captured_audio.bin')
            if (md/'captured_video.bin').exists() and (md/'captured_audio.bin').exists():
              subprocess.run(['ffmpeg','-y','-i',str(md/'captured_video.bin'),'-i',str(md/'captured_audio.bin'),'-c','copy',str(md/'source_muxed.mp4')],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=600)
              st.append(f'mux_exists={(md/"source_muxed.mp4").exists()} mux_bytes={(md/"source_muxed.mp4").stat().st_size if (md/"source_muxed.mp4").exists() else 0}')
          except Exception:
            st.append(traceback.format_exc())
          (td/'media_download_status.txt').write_text('\n'.join(st),encoding='utf-8')
          PY
          # create small diagnostic contact sheets from browser screenshots
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          import math,json,re
          fd=Path('out/browser_frames'); td=Path('out/text')
          imgs=sorted(fd.glob('frame_*.jpg'))
          if not imgs: raise SystemExit
          try: font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',16)
          except: font=ImageFont.load_default()
          # group every 30 source frames = one minute because interval 2s
          index=[]
          for gi in range(math.ceil(len(imgs)/30)):
            subset=imgs[gi*30:(gi+1)*30]
            if not subset:continue
            tw,th,lh,cols=256,144,22,5; rows=math.ceil(len(subset)/cols)
            can=Image.new('RGB',(cols*tw,rows*(th+lh)),'white')
            for n,p in enumerate(subset):
              im=Image.open(p).convert('RGB'); im.thumbnail((tw,th)); tile=Image.new('RGB',(tw,th),'black'); tile.paste(im,((tw-im.width)//2,(th-im.height)//2)); x=n%cols*tw; y=n//cols*(th+lh); can.paste(tile,(x,y)); d=ImageDraw.Draw(can); m=re.search(r'_(\d{10})\.jpg$',p.name); ms=int(m.group(1)) if m else 0; sec=ms/1000; mm=int(sec//60); ss=sec-mm*60; d.text((x+3,y+th+2),f'{mm:02d}:{ss:04.1f}',fill='black',font=font)
            op=td/f'contact_minute_{gi:02d}.jpg'; can.save(op,quality=70,optimize=True); index.append(op.name)
          (td/'contact_index.json').write_text(json.dumps(index,indent=2),encoding='utf-8')
          PY
          exit 0
      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: wosit-browser-evidence
          path: |
            out/text
            out/browser_frames
          compression-level: 6
          if-no-files-found: warn
      - name: Upload captured media
        uses: actions/upload-artifact@v4
        with:
          name: wosit-browser-media
          path: out/media
          compression-level: 1
          if-no-files-found: warn
