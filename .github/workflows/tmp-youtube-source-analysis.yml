name: tmp-youtube-source-analysis

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-kor fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install yt-dlp curl_cffi faster-whisper opencv-python-headless pillow numpy pytesseract requests

      - name: Acquire transcript and source media through multiple independent paths
        env:
          VIDEO_ID: woSiT_kytXo
          VIDEO_URL: https://www.youtube.com/watch?v=woSiT_kytXo
        run: |
          set +e
          mkdir -p out/text out/media out/frames out/contact
          STATUS=out/text/acquisition_status.txt
          echo "video_id=$VIDEO_ID" > "$STATUS"
          date -u +'%Y-%m-%dT%H:%M:%SZ' >> "$STATUS"

          echo '=== transcript API ===' >> "$STATUS"
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 120 \
            "https://youtube-transcript.ai/transcript/${VIDEO_ID}.txt?lang=ko" \
            -o out/text/transcript_api_ko.md 2>>"$STATUS"
          echo "transcript_exit=$?" >> "$STATUS"

          echo '=== yt-dlp standard + JS runtime/remote EJS ===' >> "$STATUS"
          yt-dlp --no-playlist --remote-components ejs:github --js-runtimes node \
            --impersonate chrome --dump-single-json "$VIDEO_URL" \
            > out/text/metadata_ytdlp.json 2>>"$STATUS"
          echo "metadata_ytdlp_exit=$?" >> "$STATUS"
          yt-dlp --no-playlist --remote-components ejs:github --js-runtimes node \
            --impersonate chrome -f 'bv*[height<=720]+ba/b[height<=720]/best' \
            --merge-output-format mp4 -o 'out/media/video.%(ext)s' "$VIDEO_URL" 2>>"$STATUS"
          echo "video_ytdlp_exit=$?" >> "$STATUS"

          echo '=== Piped + Invidious API fallbacks ===' >> "$STATUS"
          python - <<'PY'
          from pathlib import Path
          import requests, json, subprocess, traceback, os, sys, urllib.parse
          vid='woSiT_kytXo'
          t=Path('out/text'); m=Path('out/media'); status=t/'acquisition_status.txt'
          def log(s):
              with status.open('a',encoding='utf-8') as f: f.write(s+'\n')
          def dl(url,path):
              log(f'download {url[:120]} -> {path}')
              with requests.get(url,stream=True,timeout=(20,120),headers={'User-Agent':'Mozilla/5.0'}) as r:
                  r.raise_for_status()
                  with open(path,'wb') as f:
                      for ch in r.iter_content(1024*1024):
                          if ch: f.write(ch)
              return Path(path).stat().st_size
          def have_video():
              return any(m.glob('video.*')) or (m/'video.mp4').exists()

          piped=[
            'https://pipedapi.kavin.rocks','https://pipedapi.tokhmi.xyz','https://pipedapi.moomoo.me',
            'https://pipedapi.syncpundit.io','https://api-piped.mha.fi','https://piped-api.garudalinux.org'
          ]
          if not have_video():
            for idx,base in enumerate(piped):
              try:
                u=f'{base}/streams/{vid}'
                r=requests.get(u,timeout=45,headers={'User-Agent':'Mozilla/5.0'}); log(f'PIPED {base} status={r.status_code} bytes={len(r.content)}')
                if r.status_code!=200: continue
                data=r.json(); (t/f'piped_{idx}.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
                vs=[x for x in data.get('videoStreams',[]) if x.get('url') and (x.get('height') or 0)<=720]
                aus=[x for x in data.get('audioStreams',[]) if x.get('url')]
                prog=sorted([x for x in vs if not x.get('videoOnly')],key=lambda x:(x.get('height') or 0,x.get('bitrate') or 0),reverse=True)
                if prog:
                  ext='.mp4' if 'mp4' in (prog[0].get('mimeType') or '').lower() else '.webm'
                  dl(prog[0]['url'],m/f'video{ext}')
                elif vs and aus:
                  v=sorted(vs,key=lambda x:(x.get('height') or 0,x.get('bitrate') or 0),reverse=True)[0]
                  a=sorted(aus,key=lambda x:x.get('bitrate') or 0,reverse=True)[0]
                  dl(v['url'],m/'video_only.bin'); dl(a['url'],m/'audio_only.bin')
                  subprocess.run(['ffmpeg','-y','-i',str(m/'video_only.bin'),'-i',str(m/'audio_only.bin'),'-c','copy',str(m/'video.mp4')],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                for sidx,s in enumerate(data.get('subtitles',[])):
                  if s.get('url') and str(s.get('code','')).startswith('ko'):
                    try: dl(s['url'],t/f'piped_sub_{sidx}.txt')
                    except Exception as e: log(f'PIPED subtitle error {e}')
                if have_video(): log(f'PIPED SUCCESS {base}'); break
              except Exception as e: log(f'PIPED ERR {base}: {type(e).__name__}: {e}')

          inv=[
            'https://inv.nadeko.net','https://invidious.nerdvpn.de','https://yt.chocolatemoo53.com','https://invidious.tiekoetter.com'
          ]
          if not have_video():
            for idx,base in enumerate(inv):
              try:
                u=f'{base}/api/v1/videos/{vid}'
                r=requests.get(u,timeout=45,headers={'User-Agent':'Mozilla/5.0'}); log(f'INVIDIOUS {base} status={r.status_code} bytes={len(r.content)}')
                if r.status_code!=200: continue
                data=r.json(); (t/f'invidious_{idx}.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
                fs=data.get('formatStreams',[]) or []
                fs=[x for x in fs if x.get('url')]
                def h(x):
                    import re
                    q=x.get('qualityLabel') or x.get('quality') or ''
                    mm=re.search(r'(\d+)',q); return int(mm.group(1)) if mm else 0
                fs=[x for x in fs if h(x)<=720]
                if fs:
                  v=sorted(fs,key=h,reverse=True)[0]
                  ext='.mp4' if 'mp4' in (v.get('type') or '').lower() or v.get('container')=='mp4' else '.webm'
                  dl(v['url'],m/f'video{ext}')
                if have_video(): log(f'INVIDIOUS SUCCESS {base}'); break
              except Exception as e: log(f'INVIDIOUS ERR {base}: {type(e).__name__}: {e}')
          PY

          VIDEO_FILE=$(find out/media -maxdepth 1 -type f \( -name 'video.mp4' -o -name 'video.webm' -o -name 'video.mkv' \) | head -1)
          if [ -n "$VIDEO_FILE" ]; then
            echo "VIDEO_FILE=$VIDEO_FILE" >> "$STATUS"
            ls -lh "$VIDEO_FILE" >> "$STATUS"
            ffprobe -v error -show_format -show_streams -of json "$VIDEO_FILE" > out/text/ffprobe.json
            ffmpeg -y -i "$VIDEO_FILE" -vn -ac 1 -ar 16000 -c:a pcm_s16le out/media/audio_16k.wav 2>out/text/ffmpeg_audio.log
          else
            echo 'NO_VIDEO_FILE' >> "$STATUS"
          fi
          exit 0

      - name: Independent ASR with faster-whisper
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          import json, sys, traceback
          out=Path('out/text'); audio=Path('out/media/audio_16k.wav'); status=out/'asr_status.txt'
          if not audio.exists(): status.write_text('audio missing\n',encoding='utf-8'); raise SystemExit
          try:
            from faster_whisper import WhisperModel
            model=WhisperModel('small',device='cpu',compute_type='int8')
            segs,info=model.transcribe(str(audio),language='ko',beam_size=5,vad_filter=True,word_timestamps=True,condition_on_previous_text=True)
            rows=[]; md=[]
            for s in segs:
              rows.append({'start':s.start,'end':s.end,'text':s.text.strip(),'words':[{'start':w.start,'end':w.end,'word':w.word,'probability':w.probability} for w in (s.words or [])]})
              mm=int(s.start//60); ss=s.start-mm*60; md.append(f'[{mm:02d}:{ss:05.2f}] {s.text.strip()}')
            (out/'asr_faster_whisper_small.json').write_text(json.dumps({'language':info.language,'language_probability':info.language_probability,'duration':info.duration,'segments':rows},ensure_ascii=False,indent=2),encoding='utf-8')
            (out/'asr_faster_whisper_small.md').write_text('\n'.join(md),encoding='utf-8')
            status.write_text(f'ok segments={len(rows)} duration={info.duration} lang={info.language} prob={info.language_probability}\n',encoding='utf-8')
          except Exception: status.write_text(traceback.format_exc(),encoding='utf-8')
          PY
          exit 0

      - name: Process every decoded frame and build OCR/keyframe evidence
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          import csv,json,math
          import cv2,numpy as np,pytesseract
          from PIL import Image,ImageDraw,ImageFont
          root=Path('out'); td=root/'text'; fd=root/'frames'; cd=root/'contact'
          vids=list((root/'media').glob('video.*')); status=td/'visual_status.txt'
          if not vids: status.write_text('video missing\n',encoding='utf-8'); raise SystemExit
          cap=cv2.VideoCapture(str(vids[0])); fps=float(cap.get(cv2.CAP_PROP_FPS) or 30); total=int(cap.get(cv2.CAP_PROP_FRAME_COUNT) or 0); w=int(cap.get(cv2.CAP_PROP_FRAME_WIDTH)); h=int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT)); dur=total/fps if fps else 0
          sw=160; sh=max(90,int(sw*h/max(w,1))); prev=None; last=-999; idx=0; key=[]
          with open(td/'frame_manifest.csv','w',newline='',encoding='utf-8') as f:
            cw=csv.writer(f); cw.writerow(['frame_index','timestamp_sec','adjacent_mad','is_keyframe'])
            while True:
              ok,fr=cap.read()
              if not ok: break
              t=idx/fps; gray=cv2.cvtColor(cv2.resize(fr,(sw,sh)),cv2.COLOR_BGR2GRAY); mad=0 if prev is None else float(np.mean(cv2.absdiff(gray,prev)))
              save=(idx==0) or mad>=4.0 or (t-last)>=2.0
              if save:
                fn=f'kf_{idx:07d}_{int(t*1000):010d}.jpg'; cv2.imwrite(str(fd/fn),fr,[int(cv2.IMWRITE_JPEG_QUALITY),82]); key.append({'frame_index':idx,'timestamp_sec':t,'adjacent_mad':mad,'file':fn}); last=t
              cw.writerow([idx,f'{t:.6f}',f'{mad:.6f}',1 if save else 0]); prev=gray; idx+=1
          cap.release();
          ocr=[]
          for k in key:
            im=cv2.imread(str(fd/k['file'])); g=cv2.cvtColor(im,cv2.COLOR_BGR2GRAY)
            if g.shape[1]<1400:
              sc=1400/g.shape[1]; g=cv2.resize(g,None,fx=sc,fy=sc,interpolation=cv2.INTER_CUBIC)
            try: txt=pytesseract.image_to_string(g,lang='kor+eng',config='--psm 6',timeout=8).strip()
            except Exception as e: txt=f'[OCR_ERROR] {e}'
            ocr.append({**k,'ocr':txt})
          with open(td/'keyframes_ocr.jsonl','w',encoding='utf-8') as f:
            for r in ocr: f.write(json.dumps(r,ensure_ascii=False)+'\n')
          (td/'keyframes.json').write_text(json.dumps(key,ensure_ascii=False,indent=2),encoding='utf-8')
          try: font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',18)
          except: font=ImageFont.load_default()
          sheets=[]
          for minute in range(math.ceil(dur/60)):
            ss=[k for k in key if minute*60<=k['timestamp_sec']<(minute+1)*60]
            if not ss: continue
            if len(ss)>24:
              ids=np.linspace(0,len(ss)-1,24).round().astype(int); ss=[ss[j] for j in ids]
            tw,th,lh,cols=320,180,24,4; rows=math.ceil(len(ss)/cols); can=Image.new('RGB',(cols*tw,rows*(th+lh)),'white'); chosen=[]
            for n,k in enumerate(ss):
              im=Image.open(fd/k['file']).convert('RGB'); im.thumbnail((tw,th)); tile=Image.new('RGB',(tw,th),'black'); tile.paste(im,((tw-im.width)//2,(th-im.height)//2)); x=n%cols*tw; y=n//cols*(th+lh); can.paste(tile,(x,y)); d=ImageDraw.Draw(can); sec=k['timestamp_sec']; mm=int(sec//60); s=sec-mm*60; d.text((x+4,y+th+2),f'{mm:02d}:{s:05.2f} f={k["frame_index"]} D={k["adjacent_mad"]:.1f}',fill='black',font=font); chosen.append(k['file'])
            op=cd/f'minute_{minute:02d}.jpg'; can.save(op,quality=78,optimize=True); sheets.append({'minute':minute,'file':op.name,'frames':chosen})
          (td/'contact_sheet_index.json').write_text(json.dumps(sheets,ensure_ascii=False,indent=2),encoding='utf-8')
          status.write_text(f'ok fps={fps} decoded_frames={idx} declared_frames={total} size={w}x{h} duration={dur:.3f} keyframes={len(key)} sheets={len(sheets)}\n',encoding='utf-8')
          PY
          exit 0

      - name: Upload text evidence
        uses: actions/upload-artifact@v4
        with:
          name: wosit-text-evidence-v2
          path: out/text
          compression-level: 6
          if-no-files-found: warn
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: wosit-visual-evidence-v2
          path: |
            out/frames
            out/contact
          compression-level: 6
          if-no-files-found: warn
      - name: Upload source media
        uses: actions/upload-artifact@v4
        with:
          name: wosit-source-media-v2
          path: out/media
          compression-level: 1
          if-no-files-found: warn
